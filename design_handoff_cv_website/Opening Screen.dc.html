<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #d4b262; text-decoration: none; }
  a:hover { color: #e6c983; }
  @keyframes marquee {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0); }
  }
  @keyframes goldpulse {
    0%,100% { box-shadow: 0 30px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(212,178,98,.9), 0 0 34px -6px rgba(212,178,98,.35); }
    50%     { box-shadow: 0 30px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(212,178,98,1), 0 0 60px 0 rgba(212,178,98,.6); }
  }
  @keyframes floatnudge {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-9px); }
  }
</style>
</helmet>
<div style="position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 120% at 50% 35%, #1a1a1e 0%, #0c0c0e 60%, #060607 100%);font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;color:#e8e6e0;">

  <div style="{{ pileStyle }}">
    <sc-for list="{{ rows }}" as="row" hint-placeholder-count="5">
      <div style="{{ row.rowStyle }}">
        <div style="{{ row.trackStyle }}">
          <sc-for list="{{ row.cards }}" as="c" hint-placeholder-count="16">
            <div style="{{ c.wrap }}">
              <div style="height:8px;width:38%;border-radius:2px;background:rgba(60,56,48,.45);margin-bottom:8px;"></div>
              <div style="display:flex;gap:7px;margin-bottom:8px;">
                <div style="width:20px;height:20px;border-radius:50%;background:rgba(60,56,48,.3);flex:none;"></div>
                <div style="flex:1;display:flex;flex-direction:column;gap:4px;justify-content:center;">
                  <div style="height:4px;width:80%;border-radius:2px;background:rgba(60,56,48,.25);"></div>
                  <div style="height:4px;width:55%;border-radius:2px;background:rgba(60,56,48,.25);"></div>
                </div>
              </div>
              <div style="height:4px;width:100%;border-radius:2px;background:rgba(60,56,48,.18);margin-bottom:4px;"></div>
              <div style="height:4px;width:90%;border-radius:2px;background:rgba(60,56,48,.18);"></div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 70% at 50% 45%, transparent 40%, rgba(6,6,7,.55) 100%);"></div>

  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;">

    <div onClick="{{ open }}" style="{{ clipStyle }}">
      <div style="position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:98px;height:32px;border-radius:7px 7px 11px 11px;background:linear-gradient(180deg,#f3dea3 0%,#dcb662 18%,#b3872f 55%,#8a6320 80%,#c9a13f 100%);box-shadow:0 6px 12px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.5),inset 0 -3px 4px rgba(0,0,0,.35);z-index:3;"></div>
      <div style="position:absolute;top:-29px;left:50%;transform:translateX(-50%);width:42px;height:24px;border:5px solid;border-image:linear-gradient(180deg,#f3dea3,#8a6320) 1;border-bottom:none;border-radius:13px 13px 0 0;z-index:2;box-shadow:0 2px 4px rgba(0,0,0,.4);"></div>

      <div style="position:absolute;inset:16px 16px 16px 16px;border-radius:3px;background:linear-gradient(168deg,#f7f4ec 0%,#efe9dc 100%);overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.04);{{ paperFilter }}">
        <div style="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(179deg,rgba(0,0,0,.015) 0px,rgba(0,0,0,0) 1px,rgba(0,0,0,0) 27px,rgba(0,0,0,.02) 28px),linear-gradient(115deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 30%);"></div>
        <div style="padding:22px 22px;position:relative;">
          <div style="font-family: Poppins; color: #000000">Jordan Avery</div>
          <div style="{{ titleRevealStyle }}">Senior Business Analyst</div>
          <div style="height:1px;background:#c8c2b4;margin:16px 0;"></div>
          <div style="display:flex;gap:14px;margin-bottom:18px;">
            <div style="width:56px;height:56px;border-radius:4px;background:#d8d2c4;flex:none;"></div>
            <div style="flex:1;display:flex;flex-direction:column;gap:7px;justify-content:center;">
              <div style="height:7px;width:90%;border-radius:2px;background:#c9c3b5;"></div>
              <div style="height:7px;width:70%;border-radius:2px;background:#c9c3b5;"></div>
              <div style="height:7px;width:82%;border-radius:2px;background:#c9c3b5;"></div>
            </div>
          </div>
          <div style="height:6px;width:100%;border-radius:2px;background:#d3cdbf;margin-bottom:8px;"></div>
          <div style="height:6px;width:96%;border-radius:2px;background:#d3cdbf;margin-bottom:8px;"></div>
          <div style="height:6px;width:98%;border-radius:2px;background:#d3cdbf;margin-bottom:8px;"></div>
          <div style="height:6px;width:64%;border-radius:2px;background:#d3cdbf;margin-bottom:18px;"></div>
          <div style="height:6px;width:100%;border-radius:2px;background:#d3cdbf;margin-bottom:8px;"></div>
          <div style="height:6px;width:88%;border-radius:2px;background:#d3cdbf;margin-bottom:8px;"></div>
          <div style="height:6px;width:93%;border-radius:2px;background:#d3cdbf;"></div>
        </div>
      </div>

      <div style="position:absolute;right:-13px;bottom:30px;width:16px;height:218px;transform:rotate(24deg);transform-origin:bottom center;z-index:6;pointer-events:none;filter:drop-shadow(3px 6px 6px rgba(0,0,0,.5));">
        <div style="position:absolute;bottom:24px;left:0;width:16px;height:176px;border-radius:8px;background:linear-gradient(90deg,#050505 0%,#242427 16%,#565559 34%,#8f8e91 44%,#4c4b4f 55%,#1c1c1e 72%,#020202 100%);"></div>
        <div style="position:absolute;bottom:24px;left:2px;width:2px;height:176px;border-radius:1px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.05));"></div>
        <div style="position:absolute;bottom:154px;left:0;width:16px;height:34px;border-radius:8px 8px 0 0;background:linear-gradient(90deg,#7a5c22 0%,#e9cc84 22%,#fbe9b8 40%,#c9a13f 55%,#8a6320 75%,#6b4b16 100%);"></div>
        <div style="position:absolute;bottom:150px;left:0;width:16px;height:4px;background:rgba(0,0,0,.3);"></div>
        <div style="position:absolute;bottom:62px;left:-3px;width:5px;height:100px;border-radius:2px;background:linear-gradient(90deg,#3a3a3c,#e8e8e6 45%,#9a9a9c 70%,#2a2a2c);box-shadow:1px 0 2px rgba(0,0,0,.4);"></div>
        <div style="position:absolute;bottom:0;left:0;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:24px solid #c9a13f;"></div>
        <div style="position:absolute;bottom:-2px;left:6px;width:0;height:0;border-left:2px solid transparent;border-right:2px solid transparent;border-top:5px solid #f3dea3;"></div>
      </div>
    </div>

    <div style="{{ promptStyle }}">
      <div style="font-family: Poppins; font-size: 20px; font-style: italic; color: #f0ede6; margin-bottom: 12px; font-weight: 300">Click the clipboard to see further</div>
      
    </div>

    <div style="{{ revealStyle }}">
      <div style="font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#d4b262;">Opening full CV…</div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#d4b262&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#d4b262&quot;,&quot;#b8c0cc&quot;,&quot;#c98a5a&quot;,&quot;#9fb08a&quot;]},&quot;pileDensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6,&quot;min&quot;:1,&quot;max&quot;:10,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;blurAmount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4.5,&quot;min&quot;:0,&quot;max&quot;:9,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { opened: false };

  makeRows() {
    const density = this.props.pileDensity ?? 6;
    const rowCount = Math.max(3, Math.min(7, Math.round(3 + density * 0.4)));
    const cardW = 168, cardH = 104, gap = 38, setPerCopy = 8, dur = 36;
    const cardStyle = {
      width: cardW + "px", height: cardH + "px", flex: "none",
      padding: "13px 14px", background: "rgba(244,241,234,.55)",
      border: "1px solid rgba(255,255,255,.18)", borderRadius: "6px",
      opacity: 0.3, filter: "blur(0.4px)",
    };
    const rows = [];
    for (let r = 0; r < rowCount; r++) {
      const top = rowCount > 1 ? 4 + r * (90 / (rowCount - 1)) : 44;
      const cards = [];
      for (let copy = 0; copy < 2; copy++) {
        for (let i = 0; i < setPerCopy; i++) cards.push({ wrap: cardStyle });
      }
      rows.push({
        rowStyle: { position: "absolute", top: top + "%", left: 0, width: "100%", height: cardH + "px", overflow: "hidden" },
        trackStyle: { display: "flex", gap: gap + "px", width: "max-content", animation: "marquee " + dur + "s linear infinite" },
        cards,
      });
    }
    return rows;
  }

  renderVals() {
    const opened = this.state.opened;
    const accent = this.props.accentColor ?? "#d4b262";
    const blur = this.props.blurAmount ?? 4.5;
    const ease = "cubic-bezier(.22,1,.36,1)";

    return {
      rows: this.makeRows(),
      open: () => this.setState({ opened: true }),

      pileStyle: {
        position: "absolute", inset: 0,
        transition: "opacity 1s " + ease,
        opacity: opened ? 0 : 1,
      },
      counterStyle: {
        fontSize: "11px", letterSpacing: "0.32em", color: "rgba(232,230,224,.4)",
        transition: "opacity .7s " + ease, opacity: opened ? 0 : 1,
      },
      clipStyle: {
        position: "relative", width: "336px", height: "424px",
        borderRadius: "10px",
        backgroundImage: "repeating-linear-gradient(89deg, rgba(0,0,0,.16) 0px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px, rgba(255,214,150,.08) 4px, rgba(0,0,0,0) 6px), repeating-linear-gradient(91deg, rgba(60,30,10,.35) 0px, rgba(60,30,10,0) 2px, rgba(120,70,30,.25) 5px, rgba(60,30,10,0) 9px, rgba(30,15,5,.3) 13px), linear-gradient(115deg, #a9764a 0%, #8a5c37 22%, #6f4526 48%, #7d5230 68%, #5c3a20 100%)",
        boxShadow: "inset 0 2px 3px rgba(255,214,150,.35), inset 0 -10px 22px rgba(0,0,0,.5), inset 10px 0 18px rgba(0,0,0,.25), inset -6px 0 14px rgba(255,214,150,.08)",
        border: "2px solid " + accent,
        outline: "1px solid rgba(0,0,0,.35)",
        outlineOffset: "-3px",
        animation: opened ? "none" : "goldpulse 3.4s ease-in-out infinite, floatnudge 5s ease-in-out infinite",
        cursor: "pointer",
        transition: "transform 1.1s " + ease,
        transform: opened ? "scale(1.14) translateY(-6px)" : "scale(1)",
      },
      paperFilter: {
        filter: opened ? "blur(0px)" : "blur(" + blur + "px)",
        transition: "filter 1s " + ease,
      },
      nameRevealStyle: {
        fontFamily: "Newsreader,Georgia,serif", fontSize: "26px", color: "#1a1a1c",
        fontWeight: 500, lineHeight: 1,
        transition: "opacity .9s " + ease, opacity: opened ? 1 : 0.9,
      },
      titleRevealStyle: {
        fontSize: "12px", letterSpacing: "0.16em", textTransform: "uppercase",
        color: accent, marginTop: "8px", fontWeight: 700,
        filter: opened ? "none" : "grayscale(.4)",
      },
      promptStyle: {
        textAlign: "center", maxWidth: "420px",
        transition: "opacity .5s " + ease, opacity: opened ? 0 : 1,
        pointerEvents: "none",
      },
      revealStyle: {
        position: "absolute", bottom: "58px", left: 0, right: 0, textAlign: "center",
        transition: "opacity .8s " + ease + " .4s", opacity: opened ? 1 : 0,
        pointerEvents: "none",
      },
    };
  }
}
</script>
</body>
</html>
